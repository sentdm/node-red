<script type="text/javascript">
(function(){
'use strict';
const definitions=[["get-account","Get Account",[],"Return the authenticated account, channels and profile information."],["send-message","Send Message",[["to","Recipients","payload.to","msg"],["channel","Channels","sent","str"],["text","Text","payload.text","msg"],["template","Template","","str"],["parameters","Parameters","{}","json"],["sandbox","Sandbox",false,"bool"],["idempotencyKey","Idempotency key","","str"]],"Send a template or free-form message to one or more recipients."],["get-message-status","Get Message Status",[["messageId","Message ID","payload.message_id","msg"]],"Read the current status and details of a message."],["get-message-activities","Get Message Activities",[["messageId","Message ID","payload.message_id","msg"]],"Return the complete activity lifecycle supplied by Sent."],["list-contacts","List Contacts",[["page","Page",1,"num"],["pageSize","Page size",50,"num"],["search","Search","","str"],["contactChannel","Channel filter","","str"],["phoneFilter","Phone filter","","str"]],"Return one page of contacts with search, channel and phone filters."],["get-contact","Get Contact",[["contactId","Contact ID","payload.id","msg"]],"Retrieve one contact by its UUID."],["get-phone-number-details","Get Phone Number Details",[["phone","Phone","payload.phone","msg"]],"Look up carrier, line type and validity for an E.164 phone number."],["custom-api-call","Custom API Call",[["path","API path","/v3/me","str"],["query","Query","{}","json"],["body","Body","{}","json"],["headers","Headers","{}","json"],["idempotencyKey","Idempotency key","","str"]],"Call a relative Sent v3 endpoint securely."],["new-event","New Event",[],"Receive selected Sent events through an automatically registered, verified webhook."],["new-message-received","New Message Received",[],"Receive inbound message.received events only."]];
/* This file is embedded by build-editor.js inside its isolated editor closure. */
RED.nodes.registerType('sent-account', {
    category: 'config', defaults: {name: {value: ''}, useEnv: {value: false}},
    credentials: {apiKey: {type: 'password'}}, label: function(){return this.name || 'Sent Account';},
    oneditprepare: function(){
        const accountId = this.id;
        $('#sent-check').on('click', function(){
            $('#sent-account-status').text('Checking deployed credentials…');
            $.getJSON('sent/accounts/' + encodeURIComponent(accountId) + '/status').done(d => $('#sent-account-status').text('Connected: ' + d.type + (d.name ? ' · ' + d.name : ''))).fail(() => $('#sent-account-status').text('Could not authenticate. Save and deploy the account, then retry.'));
        });
    }
});
for (const [type, label, fields] of definitions) {
    const trigger = type.startsWith('new-');
    const defaults = {name: {value: ''}, account: {value: '', type: 'sent-account', required: true}};
    const typed = [...fields];
    if (type !== 'get-account') {
        defaults.profile = {value: ''};
        if (!trigger) typed.push(['profile','Sender profile','','str']);
    }
    for (const [name, _label, value, inputType] of typed) {
        defaults[name] = {value, validate: function(v){return v === undefined || RED.validators.typedInput(name + 'Type').call(this,v);}};
        defaults[name + 'Type'] = {value: inputType};
    }
    if (type === 'send-message') Object.assign(defaults, {mode:{value:'template'}, templateBy:{value:'id'}, variables:{value:[]}});
    if (type === 'custom-api-call') defaults.method = {value:'GET'};
    if (type === 'new-event') Object.assign(defaults, {events:{value:'message.delivered', required:true}, templateNames:{value:''}});
    RED.nodes.registerType('sent-' + type, {
        category: 'Sent', color: '#DDE6FF', defaults, inputs: trigger ? 0 : 1, outputs: 1,
        icon: 'sent.svg', paletteLabel: label, label: function(){return this.name || label;},
        oneditprepare: function(){
            const node = this;
            let profilePage = 1, templatePage = 1;
            for (const [name, _label, _value, inputType] of typed) {
                if (node[name] === undefined) $('#node-input-' + name).val(_value);
                $('#node-input-' + name).typedInput({default:inputType, typeField:'#node-input-' + name + 'Type', types: ['str','msg','json','num','bool','env']});
            }
            function lookup(resource, query, apply){
                const account = $('#node-input-account').val();
                if (!account || account === '_ADD_') {$('#sent-lookup-status').text('Save and deploy a Sent Account first. Manual values still work.'); return;}
                const profileInput = $('#node-input-profile');
                const dynamic = !trigger && profileInput.length && profileInput.typedInput('type') !== 'str';
                if (dynamic && resource !== 'profiles') {$('#sent-lookup-status').text('Choose a fixed profile for discovery. Dynamic profiles are evaluated at runtime.');return;}
                query.profile = resource === 'profiles' ? '' : profileInput.val() || '';
                $('#sent-lookup-status').text('Loading…');
                $.getJSON('sent/accounts/' + encodeURIComponent(account) + '/' + resource,query).done(d=>{
                    $('#sent-lookup-status').text('Options loaded. Manual values remain available.'); apply(d);
                }).fail(()=>$('#sent-lookup-status').text('Options unavailable. Deploy credentials or enter manual values.'));
            }
            function loadProfiles(){lookup('profiles',{page:profilePage},d=>{
                const select=$('#sent-profile-options').empty().append($('<option>').val('').text('Choose profile — page '+profilePage));
                for(const p of d.sender_profiles || []) select.append($('<option>').val(p.id).text(p.name || p.id));
            });}
            $('#sent-profiles').on('click',()=>{profilePage=1;loadProfiles();});
            $('#sent-profiles-next').on('click',()=>{profilePage++;loadProfiles();});
            $('#sent-profile-options').on('change',function(){if(!this.value)return;if(!trigger)$('#node-input-profile').typedInput('type','str');if(trigger)$('#node-input-profile').val(this.value);else $('#node-input-profile').typedInput('value',this.value);});
            function variables(rows){
                $('#sent-variables').empty();
                rows.forEach((row,index)=>{
                    const outer=$('<div>').addClass('form-row sent-variable').data('variableName',row.name).appendTo('#sent-variables');
                    $('<label>').text(row.name).appendTo(outer);
                    const hidden=$('<input type="hidden">').attr('id','sent-var-type-'+index).val(row.type || 'str').appendTo(outer);
                    $('<input type="text">').val(row.value ?? '').appendTo(outer).typedInput({typeField:hidden,types:['str','msg','num','bool','env'],default:row.type || 'str'});
                });
            }
            if(type==='send-message'){
                if(node.templateBy === undefined) $('#node-input-templateBy').val('id');
                if(node.mode === undefined) $('#node-input-mode').val('template');
                variables(node.variables || []);
                const showMode=()=>{$('.sent-template').toggle($('#node-input-mode').val()==='template');$('.sent-text').toggle($('#node-input-mode').val()==='text');};
                $('#node-input-mode').on('change',showMode);showMode();
                function templates(){lookup('templates',{page:templatePage,search:$('#sent-template-search').val()},d=>{
                    const select=$('#sent-template-options').empty().append($('<option>').val('').text('Choose approved template — page '+templatePage));
                    for(const t of d.templates || [])select.append($('<option>').val(t.id).text(t.name || t.id));
                });}
                $('#sent-templates').on('click',()=>{templatePage=1;templates();});
                $('#sent-templates-next').on('click',()=>{templatePage++;templates();});
                $('#sent-template-options').on('change',function(){
                    if(!this.value)return;$('#node-input-template').typedInput('type','str');$('#node-input-template').typedInput('value',this.value);$('#node-input-templateBy').val('id');
                    lookup('template',{id:this.value},d=>variables((d.variables || []).map(name=>({name,type:'str',value:''}))));
                });
            }
            $('#sent-events').on('click',()=>lookup('events',{},d=>{
                const root=$('#sent-event-options').empty(), selected=String($('#node-input-events').val()).split(',').map(s=>s.trim());
                function add(entry,parent){
                    const value=entry.event_type || (parent && !String(entry.name).includes('.') ? parent+'.'+entry.name : entry.name);
                    if(!value || entry.is_active===false)return;
                    if(entry.sub_types?.length){entry.sub_types.forEach(s=>add(s,value));return;}
                    const line=$('<label>').css({display:'block',width:'100%'}).appendTo(root);
                    $('<input type="checkbox">').css('width','auto').val(value).prop('checked',selected.includes(value)).appendTo(line).on('change',()=>$('#node-input-events').val(root.find('input:checked').map(function(){return this.value;}).get().join(',')));
                    line.append(document.createTextNode(' '+(entry.display_name || value)));
                }
                (d.event_types || []).forEach(e=>add(e));
            }));
        },
        oneditsave: function(){
            if(type==='send-message')this.variables=$('#sent-variables .sent-variable').map(function(){const input=$(this).find('input[type=text]');return {name:$(this).data('variableName'),type:input.typedInput('type'),value:input.typedInput('value')};}).get();
        }
    });
}

})();
</script>
<script type="text/html" data-template-name="sent-account"><div class="form-row"><label for="node-config-input-name">Name</label><input id="node-config-input-name" type="text"></div><div class="form-row"><label for="node-config-input-apiKey">API key</label><input id="node-config-input-apiKey" type="password" autocomplete="new-password"></div><div class="form-row"><label for="node-config-input-useEnv">Environment</label><input id="node-config-input-useEnv" type="checkbox" style="width:auto"> Use SENT_API_KEY</div><button type="button" id="sent-check" class="red-ui-button">Check connection</button><p id="sent-account-status" role="status"></p><p>Save and deploy this account before checking or loading options. Credentials are stored by Node-RED and excluded from flow exports.</p></script>
<script type="text/html" data-help-name="sent-account"><p>Share a secure Sent account across action and trigger nodes.</p><h3>Configuration</h3><p>Enter a current UUID API key as a password credential, or explicitly select SENT_API_KEY from the server environment. The editor receives only the has_apiKey flag for stored keys. Traffic uses https://api.sent.dm. Check connection validates GET /v3/me after deployment. A profile-scoped key requires blank profile fields on action and trigger nodes.</p></script>
<script type="text/html" data-template-name="sent-get-account"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div><div class="form-row"><label for="node-input-account">Sent Account</label><input id="node-input-account" type="text"></div><p class="form-tips">Returns the authenticated account without additional parameters.</p><p id="sent-lookup-status" role="status"></p></script>
<script type="text/html" data-help-name="sent-get-account"><p>Return the authenticated account, channels and profile information.</p><h3>Inputs</h3><dl class="message-properties"><dt>msg<span class="property-type">object</span></dt><dd>Any input triggers the request.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">object | string</span></dt><dd>Sent data portion, or non-envelope response body for custom calls.</dd><dt>sent<span class="property-type">object</span></dt><dd>statusCode, meta, requestId, responseTime, apiVersion, profileId, sandbox, idempotentReplayed and originalRequestId.</dd></dl><h3>Details</h3><p>No message parameters are needed. Returns the account associated with the configured credential. Use the account dialog’s Check connection after deploying it to validate authentication.</p><p>Incoming msg properties are preserved. Optional sender profile uses x-profile-id only with organization keys. Errors appear in Catch nodes; action errors add structured sent.error with status, code, details, doc_url, request ID and Retry-After when supplied. GET requests retry transient failures at most twice with backoff; rate limits are respected. Credentials and signing secrets are redacted.</p><h3>References</h3><ul><li><a href="https://docs.sent.dm/reference/api">Sent v3 API</a></li></ul></script>
<script type="text/html" data-template-name="sent-send-message"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div><div class="form-row"><label for="node-input-account">Sent Account</label><input id="node-input-account" type="text"></div><div class="form-row"><label for="node-input-profile">Sender profile</label><input id="node-input-profile" type="text"></div><input type="hidden" id="node-input-profileType"><div class="form-row"><button type="button" class="red-ui-button" id="sent-profiles">Load profiles</button> <button type="button" class="red-ui-button" id="sent-profiles-next">Next page</button><select id="sent-profile-options" style="width:65%"><option value="">Manual ID / account scope</option></select></div><div class="form-row"><label for="node-input-mode">Mode</label><select id="node-input-mode"><option value="template">Template</option><option value="text">Free-form text</option></select></div><div class="form-row sent-template"><label for="node-input-templateBy">Reference</label><select id="node-input-templateBy"><option value="id">Template ID</option><option value="name">Template name</option></select></div><div class="form-row "><label for="node-input-to">Recipients</label><input id="node-input-to" type="text"></div><input type="hidden" id="node-input-toType"><div class="form-row "><label for="node-input-channel">Channels</label><input id="node-input-channel" type="text"></div><input type="hidden" id="node-input-channelType"><div class="form-row sent-text"><label for="node-input-text">Text</label><input id="node-input-text" type="text"></div><input type="hidden" id="node-input-textType"><div class="form-row sent-template"><label for="node-input-template">Template</label><input id="node-input-template" type="text"></div><input type="hidden" id="node-input-templateType"><div class="form-row sent-template"><label for="node-input-parameters">Parameters</label><input id="node-input-parameters" type="text"></div><input type="hidden" id="node-input-parametersType"><div class="form-row "><label for="node-input-sandbox">Sandbox</label><input id="node-input-sandbox" type="text"></div><input type="hidden" id="node-input-sandboxType"><div class="form-row "><label for="node-input-idempotencyKey">Idempotency key</label><input id="node-input-idempotencyKey" type="text"></div><input type="hidden" id="node-input-idempotencyKeyType"><div class="sent-template"><div class="form-row"><input id="sent-template-search" placeholder="Search approved templates" style="width:55%"> <button type="button" class="red-ui-button" id="sent-templates">Search</button> <button type="button" class="red-ui-button" id="sent-templates-next">Next page</button></div><div class="form-row"><label>Approved</label><select id="sent-template-options"><option value="">Choose, or enter ID/name above</option></select></div><div id="sent-variables"></div></div><p class="form-tips">Leave Sender profile blank for account scope or profile-scoped keys. Use a manual ID if lookups are unavailable.</p><p id="sent-lookup-status" role="status"></p></script>
<script type="text/html" data-help-name="sent-send-message"><p>Send a template or free-form message to one or more recipients.</p><h3>Inputs</h3><dl class="message-properties"><dt>payload.to<span class="property-type">string | object</span></dt><dd>Recipients: choose a fixed value or a msg property using the typed selector.</dd><dt>channel<span class="property-type">str</span></dt><dd>Channels: choose a fixed value or a msg property using the typed selector.</dd><dt>payload.text<span class="property-type">string | object</span></dt><dd>Text: choose a fixed value or a msg property using the typed selector.</dd><dt>template<span class="property-type">str</span></dt><dd>Template: choose a fixed value or a msg property using the typed selector.</dd><dt>parameters<span class="property-type">json</span></dt><dd>Parameters: choose a fixed value or a msg property using the typed selector.</dd><dt>sandbox<span class="property-type">bool</span></dt><dd>Sandbox: choose a fixed value or a msg property using the typed selector.</dd><dt>idempotencyKey<span class="property-type">str</span></dt><dd>Idempotency key: choose a fixed value or a msg property using the typed selector.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">object | string</span></dt><dd>Sent data portion, or non-envelope response body for custom calls.</dd><dt>sent<span class="property-type">object</span></dt><dd>statusCode, meta, requestId, responseTime, apiVersion, profileId, sandbox, idempotentReplayed and originalRequestId.</dd></dl><h3>Details</h3><p>Recipients accept an E.164 string, comma-separated strings, or an array from msg/JSON. Channels accept sent, sms, whatsapp, rcs or an array; multiple channels broadcast. Omit channels or choose sent for automatic routing. Template mode accepts ID or name, parameters as JSON/msg, and individually typed declared variables. Search approved templates using the selected fixed profile; manual IDs work without lookups. Dynamic profile/template values resolve at runtime.</p><p>For SMS, RCS and automatic routing, a contact who has never replied needs an approved template before free-form text. The template opens a seven-day window; a qualifying past reply removes this Sent gate. Pinned WhatsApp free-form instead requires a recent inbound WhatsApp message within Meta's 24-hour window. HTTP 202 means accepted, not delivered; use webhooks or status checks for BLOCKED/FAILED and delivery outcomes. Sandbox validates without side effects. A sandbox ID may not exist for later status reads.</p><p>An empty idempotency key generates a stable hash of node ID, msg._msgid, body and profile. Internal retries reuse it. Explicit keys must be 1–255 alphanumeric, hyphen or underscore characters. Sent caches successful responses for 24 hours; never reuse a key for a different operation.</p><p>Incoming msg properties are preserved. Optional sender profile uses x-profile-id only with organization keys. Errors appear in Catch nodes; action errors add structured sent.error with status, code, details, doc_url, request ID and Retry-After when supplied. GET requests retry transient failures at most twice with backoff; rate limits are respected. Credentials and signing secrets are redacted.</p><h3>References</h3><ul><li><a href="https://docs.sent.dm/reference/api">Sent v3 API</a></li></ul></script>
<script type="text/html" data-template-name="sent-get-message-status"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div><div class="form-row"><label for="node-input-account">Sent Account</label><input id="node-input-account" type="text"></div><div class="form-row"><label for="node-input-profile">Sender profile</label><input id="node-input-profile" type="text"></div><input type="hidden" id="node-input-profileType"><div class="form-row"><button type="button" class="red-ui-button" id="sent-profiles">Load profiles</button> <button type="button" class="red-ui-button" id="sent-profiles-next">Next page</button><select id="sent-profile-options" style="width:65%"><option value="">Manual ID / account scope</option></select></div><div class="form-row "><label for="node-input-messageId">Message ID</label><input id="node-input-messageId" type="text"></div><input type="hidden" id="node-input-messageIdType"><p class="form-tips">Leave Sender profile blank for account scope or profile-scoped keys. Use a manual ID if lookups are unavailable.</p><p id="sent-lookup-status" role="status"></p></script>
<script type="text/html" data-help-name="sent-get-message-status"><p>Read the current status and details of a message.</p><h3>Inputs</h3><dl class="message-properties"><dt>payload.message_id<span class="property-type">string | object</span></dt><dd>Message ID: choose a fixed value or a msg property using the typed selector.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">object | string</span></dt><dd>Sent data portion, or non-envelope response body for custom calls.</dd><dt>sent<span class="property-type">object</span></dt><dd>statusCode, meta, requestId, responseTime, apiVersion, profileId, sandbox, idempotentReplayed and originalRequestId.</dd></dl><h3>Details</h3><p>Supply a fixed message UUID or choose msg (default payload.message_id). Status can change after acceptance, including BLOCKED or FAILED. Sandbox sends do not guarantee a retrievable message.</p><p>Incoming msg properties are preserved. Optional sender profile uses x-profile-id only with organization keys. Errors appear in Catch nodes; action errors add structured sent.error with status, code, details, doc_url, request ID and Retry-After when supplied. GET requests retry transient failures at most twice with backoff; rate limits are respected. Credentials and signing secrets are redacted.</p><h3>References</h3><ul><li><a href="https://docs.sent.dm/reference/api">Sent v3 API</a></li></ul></script>
<script type="text/html" data-template-name="sent-get-message-activities"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div><div class="form-row"><label for="node-input-account">Sent Account</label><input id="node-input-account" type="text"></div><div class="form-row"><label for="node-input-profile">Sender profile</label><input id="node-input-profile" type="text"></div><input type="hidden" id="node-input-profileType"><div class="form-row"><button type="button" class="red-ui-button" id="sent-profiles">Load profiles</button> <button type="button" class="red-ui-button" id="sent-profiles-next">Next page</button><select id="sent-profile-options" style="width:65%"><option value="">Manual ID / account scope</option></select></div><div class="form-row "><label for="node-input-messageId">Message ID</label><input id="node-input-messageId" type="text"></div><input type="hidden" id="node-input-messageIdType"><p class="form-tips">Leave Sender profile blank for account scope or profile-scoped keys. Use a manual ID if lookups are unavailable.</p><p id="sent-lookup-status" role="status"></p></script>
<script type="text/html" data-help-name="sent-get-message-activities"><p>Return the complete activity lifecycle supplied by Sent.</p><h3>Inputs</h3><dl class="message-properties"><dt>payload.message_id<span class="property-type">string | object</span></dt><dd>Message ID: choose a fixed value or a msg property using the typed selector.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">object | string</span></dt><dd>Sent data portion, or non-envelope response body for custom calls.</dd><dt>sent<span class="property-type">object</span></dt><dd>statusCode, meta, requestId, responseTime, apiVersion, profileId, sandbox, idempotentReplayed and originalRequestId.</dd></dl><h3>Details</h3><p>Supply a fixed message UUID or choose msg (default payload.message_id). The payload preserves message_id, activities and any pagination Sent returns; it does not synthesize missing lifecycle events.</p><p>Incoming msg properties are preserved. Optional sender profile uses x-profile-id only with organization keys. Errors appear in Catch nodes; action errors add structured sent.error with status, code, details, doc_url, request ID and Retry-After when supplied. GET requests retry transient failures at most twice with backoff; rate limits are respected. Credentials and signing secrets are redacted.</p><h3>References</h3><ul><li><a href="https://docs.sent.dm/reference/api">Sent v3 API</a></li></ul></script>
<script type="text/html" data-template-name="sent-list-contacts"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div><div class="form-row"><label for="node-input-account">Sent Account</label><input id="node-input-account" type="text"></div><div class="form-row"><label for="node-input-profile">Sender profile</label><input id="node-input-profile" type="text"></div><input type="hidden" id="node-input-profileType"><div class="form-row"><button type="button" class="red-ui-button" id="sent-profiles">Load profiles</button> <button type="button" class="red-ui-button" id="sent-profiles-next">Next page</button><select id="sent-profile-options" style="width:65%"><option value="">Manual ID / account scope</option></select></div><div class="form-row "><label for="node-input-page">Page</label><input id="node-input-page" type="text"></div><input type="hidden" id="node-input-pageType"><div class="form-row "><label for="node-input-pageSize">Page size</label><input id="node-input-pageSize" type="text"></div><input type="hidden" id="node-input-pageSizeType"><div class="form-row "><label for="node-input-search">Search</label><input id="node-input-search" type="text"></div><input type="hidden" id="node-input-searchType"><div class="form-row "><label for="node-input-contactChannel">Channel filter</label><input id="node-input-contactChannel" type="text"></div><input type="hidden" id="node-input-contactChannelType"><div class="form-row "><label for="node-input-phoneFilter">Phone filter</label><input id="node-input-phoneFilter" type="text"></div><input type="hidden" id="node-input-phoneFilterType"><p class="form-tips">Leave Sender profile blank for account scope or profile-scoped keys. Use a manual ID if lookups are unavailable.</p><p id="sent-lookup-status" role="status"></p></script>
<script type="text/html" data-help-name="sent-list-contacts"><p>Return one page of contacts with search, channel and phone filters.</p><h3>Inputs</h3><dl class="message-properties"><dt>page<span class="property-type">num</span></dt><dd>Page: choose a fixed value or a msg property using the typed selector.</dd><dt>pageSize<span class="property-type">num</span></dt><dd>Page size: choose a fixed value or a msg property using the typed selector.</dd><dt>search<span class="property-type">str</span></dt><dd>Search: choose a fixed value or a msg property using the typed selector.</dd><dt>contactChannel<span class="property-type">str</span></dt><dd>Channel filter: choose a fixed value or a msg property using the typed selector.</dd><dt>phoneFilter<span class="property-type">str</span></dt><dd>Phone filter: choose a fixed value or a msg property using the typed selector.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">object | string</span></dt><dd>Sent data portion, or non-envelope response body for custom calls.</dd><dt>sent<span class="property-type">object</span></dt><dd>statusCode, meta, requestId, responseTime, apiVersion, profileId, sandbox, idempotentReplayed and originalRequestId.</dd></dl><h3>Details</h3><p>Page is 1-indexed. Page size is 1–100. The payload contains contacts and pagination. Inspect pagination before requesting the next page; this node deliberately performs one bounded page per input. Channel filter supports sms or whatsapp. Phone filters preserve the E.164 plus sign.</p><p>Incoming msg properties are preserved. Optional sender profile uses x-profile-id only with organization keys. Errors appear in Catch nodes; action errors add structured sent.error with status, code, details, doc_url, request ID and Retry-After when supplied. GET requests retry transient failures at most twice with backoff; rate limits are respected. Credentials and signing secrets are redacted.</p><h3>References</h3><ul><li><a href="https://docs.sent.dm/reference/api">Sent v3 API</a></li></ul></script>
<script type="text/html" data-template-name="sent-get-contact"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div><div class="form-row"><label for="node-input-account">Sent Account</label><input id="node-input-account" type="text"></div><div class="form-row"><label for="node-input-profile">Sender profile</label><input id="node-input-profile" type="text"></div><input type="hidden" id="node-input-profileType"><div class="form-row"><button type="button" class="red-ui-button" id="sent-profiles">Load profiles</button> <button type="button" class="red-ui-button" id="sent-profiles-next">Next page</button><select id="sent-profile-options" style="width:65%"><option value="">Manual ID / account scope</option></select></div><div class="form-row "><label for="node-input-contactId">Contact ID</label><input id="node-input-contactId" type="text"></div><input type="hidden" id="node-input-contactIdType"><p class="form-tips">Leave Sender profile blank for account scope or profile-scoped keys. Use a manual ID if lookups are unavailable.</p><p id="sent-lookup-status" role="status"></p></script>
<script type="text/html" data-help-name="sent-get-contact"><p>Retrieve one contact by its UUID.</p><h3>Inputs</h3><dl class="message-properties"><dt>payload.id<span class="property-type">string | object</span></dt><dd>Contact ID: choose a fixed value or a msg property using the typed selector.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">object | string</span></dt><dd>Sent data portion, or non-envelope response body for custom calls.</dd><dt>sent<span class="property-type">object</span></dt><dd>statusCode, meta, requestId, responseTime, apiVersion, profileId, sandbox, idempotentReplayed and originalRequestId.</dd></dl><h3>Details</h3><p>Supply a fixed contact UUID or choose msg (default payload.id). Profile scope controls which contact is visible to the account.</p><p>Incoming msg properties are preserved. Optional sender profile uses x-profile-id only with organization keys. Errors appear in Catch nodes; action errors add structured sent.error with status, code, details, doc_url, request ID and Retry-After when supplied. GET requests retry transient failures at most twice with backoff; rate limits are respected. Credentials and signing secrets are redacted.</p><h3>References</h3><ul><li><a href="https://docs.sent.dm/reference/api">Sent v3 API</a></li></ul></script>
<script type="text/html" data-template-name="sent-get-phone-number-details"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div><div class="form-row"><label for="node-input-account">Sent Account</label><input id="node-input-account" type="text"></div><div class="form-row"><label for="node-input-profile">Sender profile</label><input id="node-input-profile" type="text"></div><input type="hidden" id="node-input-profileType"><div class="form-row"><button type="button" class="red-ui-button" id="sent-profiles">Load profiles</button> <button type="button" class="red-ui-button" id="sent-profiles-next">Next page</button><select id="sent-profile-options" style="width:65%"><option value="">Manual ID / account scope</option></select></div><div class="form-row "><label for="node-input-phone">Phone</label><input id="node-input-phone" type="text"></div><input type="hidden" id="node-input-phoneType"><p class="form-tips">Leave Sender profile blank for account scope or profile-scoped keys. Use a manual ID if lookups are unavailable.</p><p id="sent-lookup-status" role="status"></p></script>
<script type="text/html" data-help-name="sent-get-phone-number-details"><p>Look up carrier, line type and validity for an E.164 phone number.</p><h3>Inputs</h3><dl class="message-properties"><dt>payload.phone<span class="property-type">string | object</span></dt><dd>Phone: choose a fixed value or a msg property using the typed selector.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">object | string</span></dt><dd>Sent data portion, or non-envelope response body for custom calls.</dd><dt>sent<span class="property-type">object</span></dt><dd>statusCode, meta, requestId, responseTime, apiVersion, profileId, sandbox, idempotentReplayed and originalRequestId.</dd></dl><h3>Details</h3><p>Phone must be an E.164 string including +. Choose a fixed string or msg (default payload.phone). The number is encoded as a single URL segment.</p><p>Incoming msg properties are preserved. Optional sender profile uses x-profile-id only with organization keys. Errors appear in Catch nodes; action errors add structured sent.error with status, code, details, doc_url, request ID and Retry-After when supplied. GET requests retry transient failures at most twice with backoff; rate limits are respected. Credentials and signing secrets are redacted.</p><h3>References</h3><ul><li><a href="https://docs.sent.dm/reference/api">Sent v3 API</a></li></ul></script>
<script type="text/html" data-template-name="sent-custom-api-call"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div><div class="form-row"><label for="node-input-account">Sent Account</label><input id="node-input-account" type="text"></div><div class="form-row"><label for="node-input-profile">Sender profile</label><input id="node-input-profile" type="text"></div><input type="hidden" id="node-input-profileType"><div class="form-row"><button type="button" class="red-ui-button" id="sent-profiles">Load profiles</button> <button type="button" class="red-ui-button" id="sent-profiles-next">Next page</button><select id="sent-profile-options" style="width:65%"><option value="">Manual ID / account scope</option></select></div><div class="form-row"><label for="node-input-method">Method</label><select id="node-input-method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select></div><div class="form-row "><label for="node-input-path">API path</label><input id="node-input-path" type="text"></div><input type="hidden" id="node-input-pathType"><div class="form-row "><label for="node-input-query">Query</label><input id="node-input-query" type="text"></div><input type="hidden" id="node-input-queryType"><div class="form-row "><label for="node-input-body">Body</label><input id="node-input-body" type="text"></div><input type="hidden" id="node-input-bodyType"><div class="form-row "><label for="node-input-headers">Headers</label><input id="node-input-headers" type="text"></div><input type="hidden" id="node-input-headersType"><div class="form-row "><label for="node-input-idempotencyKey">Idempotency key</label><input id="node-input-idempotencyKey" type="text"></div><input type="hidden" id="node-input-idempotencyKeyType"><p class="form-tips">Leave Sender profile blank for account scope or profile-scoped keys. Use a manual ID if lookups are unavailable.</p><p id="sent-lookup-status" role="status"></p></script>
<script type="text/html" data-help-name="sent-custom-api-call"><p>Call a relative Sent v3 endpoint securely.</p><h3>Inputs</h3><dl class="message-properties"><dt>path<span class="property-type">str</span></dt><dd>API path: choose a fixed value or a msg property using the typed selector.</dd><dt>query<span class="property-type">json</span></dt><dd>Query: choose a fixed value or a msg property using the typed selector.</dd><dt>body<span class="property-type">json</span></dt><dd>Body: choose a fixed value or a msg property using the typed selector.</dd><dt>headers<span class="property-type">json</span></dt><dd>Headers: choose a fixed value or a msg property using the typed selector.</dd><dt>idempotencyKey<span class="property-type">str</span></dt><dd>Idempotency key: choose a fixed value or a msg property using the typed selector.</dd></dl><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">object | string</span></dt><dd>Sent data portion, or non-envelope response body for custom calls.</dd><dt>sent<span class="property-type">object</span></dt><dd>statusCode, meta, requestId, responseTime, apiVersion, profileId, sandbox, idempotentReplayed and originalRequestId.</dd></dl><h3>Details</h3><p>Choose GET, POST, PUT, PATCH or DELETE. Use a relative /v3/... path; put query parameters in the Query JSON object. Absolute URLs, traversal, redirects and credential header overrides are rejected. Extra headers allow Accept-Language only; profile and idempotency have dedicated fields. GET requests retry transient failures. POST/PUT/PATCH retry only with an explicit idempotency key; DELETE is not automatically retried. Set sandbox:true in mutation bodies for validation without side effects where supported. Raw non-envelope responses are preserved; secret fields are redacted.</p><p>Incoming msg properties are preserved. Optional sender profile uses x-profile-id only with organization keys. Errors appear in Catch nodes; action errors add structured sent.error with status, code, details, doc_url, request ID and Retry-After when supplied. GET requests retry transient failures at most twice with backoff; rate limits are respected. Credentials and signing secrets are redacted.</p><h3>References</h3><ul><li><a href="https://docs.sent.dm/reference/api">Sent v3 API</a></li></ul></script>
<script type="text/html" data-template-name="sent-new-event"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div><div class="form-row"><label for="node-input-account">Sent Account</label><input id="node-input-account" type="text"></div><div class="form-row"><label for="node-input-profile">Sender profile</label><input id="node-input-profile" type="text"></div><div class="form-row"><button type="button" class="red-ui-button" id="sent-profiles">Load profiles</button> <button type="button" class="red-ui-button" id="sent-profiles-next">Next page</button><select id="sent-profile-options" style="width:65%"><option value="">Manual ID / account scope</option></select></div><div class="form-row"><label for="node-input-events">Events</label><input id="node-input-events" type="text"></div><button type="button" class="red-ui-button" id="sent-events">Load event types</button><div id="sent-event-options"></div><div class="form-row"><label for="node-input-templateNames">Template names</label><input id="node-input-templateNames" type="text"></div><p>Set SENT_WEBHOOK_BASE_URL to your public HTTPS origin. Node-RED httpNodeRoot is appended automatically. Install the Sent raw-body httpAdminMiddleware hook from the README before deploying. Subscriptions register on deploy; signing secrets remain server-side.</p><p class="form-tips">Blue status means registration succeeded.</p><p id="sent-lookup-status" role="status"></p></script>
<script type="text/html" data-help-name="sent-new-event"><p>Receive selected Sent events through an automatically registered, verified webhook.</p><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">object</span></dt><dd>Full verified Sent event envelope.</dd><dt>topic<span class="property-type">string</span></dt><dd>event.event, or event.field for templates.</dd><dt>sent.webhook<span class="property-type">object</span></dt><dd>Webhook ID, event type, timestamp and hashed dedupe key. No secret.</dd></dl><h3>Details</h3><p>Enter comma-separated message.* events or the message/templates families. Approved event lookup provides checkboxes; manual entry remains usable. Template names optionally restrict templates events. Registration uses canonical parent event_types and subtype event_filters. Owned subscriptions are deleted on close; stale registrations with the exact installation/account/profile/node ownership identity are removed on restart. Set a stable, unique SENT_INSTANCE_ID for durable installation identity.</p><p>Raw HTTP bytes are verified using the per-subscription whsec_ HMAC-SHA256 secret, endpoint ID and timestamp. Missing, tampered or older/newer than five-minute signatures are rejected. Valid ignored or duplicate events receive 2xx. Acknowledgment occurs before downstream dispatch.</p><p>Dedupe keys use inbound message_id, outbound message_id + message_status, or template_id + status; other events use an envelope hash. The seven-day cache holds at most 10,000 entries per node. Oldest entries may expire early at capacity. Configure Node-RED synchronous context storage for persistence across restarts. Default memory storage resets on restart. This acknowledgment path is not a durable job queue; downstream processing must be idempotent.</p><p>Errors appear in Catch nodes; action errors add structured sent.error with status, code, details, doc_url, request ID and Retry-After when supplied. GET requests retry transient failures at most twice with backoff; rate limits are respected. Credentials and signing secrets are redacted.</p><h3>References</h3><ul><li><a href="https://docs.sent.dm/reference/api">Sent v3 API</a></li></ul></script>
<script type="text/html" data-template-name="sent-new-message-received"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div><div class="form-row"><label for="node-input-account">Sent Account</label><input id="node-input-account" type="text"></div><div class="form-row"><label for="node-input-profile">Sender profile</label><input id="node-input-profile" type="text"></div><div class="form-row"><button type="button" class="red-ui-button" id="sent-profiles">Load profiles</button> <button type="button" class="red-ui-button" id="sent-profiles-next">Next page</button><select id="sent-profile-options" style="width:65%"><option value="">Manual ID / account scope</option></select></div><p>Set SENT_WEBHOOK_BASE_URL to your public HTTPS origin. Node-RED httpNodeRoot is appended automatically. Install the Sent raw-body httpAdminMiddleware hook from the README before deploying. Subscriptions register on deploy; signing secrets remain server-side.</p><p class="form-tips">Blue status means registration succeeded.</p><p id="sent-lookup-status" role="status"></p></script>
<script type="text/html" data-help-name="sent-new-message-received"><p>Receive inbound message.received events only.</p><h3>Outputs</h3><dl class="message-properties"><dt>payload<span class="property-type">object</span></dt><dd>Full verified Sent event envelope.</dd><dt>topic<span class="property-type">string</span></dt><dd>event.event, or event.field for templates.</dd><dt>sent.webhook<span class="property-type">object</span></dt><dd>Webhook ID, event type, timestamp and hashed dedupe key. No secret.</dd></dl><h3>Details</h3><p>Registers only message.received; outbound events never emit. Registration uses canonical parent event_types and subtype event_filters. Owned subscriptions are deleted on close; stale registrations with the exact installation/account/profile/node ownership identity are removed on restart. Set a stable, unique SENT_INSTANCE_ID for durable installation identity.</p><p>Raw HTTP bytes are verified using the per-subscription whsec_ HMAC-SHA256 secret, endpoint ID and timestamp. Missing, tampered or older/newer than five-minute signatures are rejected. Valid ignored or duplicate events receive 2xx. Acknowledgment occurs before downstream dispatch.</p><p>Dedupe keys use inbound message_id, outbound message_id + message_status, or template_id + status; other events use an envelope hash. The seven-day cache holds at most 10,000 entries per node. Oldest entries may expire early at capacity. Configure Node-RED synchronous context storage for persistence across restarts. Default memory storage resets on restart. This acknowledgment path is not a durable job queue; downstream processing must be idempotent.</p><p>Errors appear in Catch nodes; action errors add structured sent.error with status, code, details, doc_url, request ID and Retry-After when supplied. GET requests retry transient failures at most twice with backoff; rate limits are respected. Credentials and signing secrets are redacted.</p><h3>References</h3><ul><li><a href="https://docs.sent.dm/reference/api">Sent v3 API</a></li></ul></script>
